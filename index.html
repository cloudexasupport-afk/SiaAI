<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0312" />
<title>JARVIS — Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --gold:#d4af37;
  --gold-light:#ffe9a8;
  --gold-soft:#f5d67b;
  --gold-deep:#a67c00;
  --bg-0:#07020e;
  --bg-1:#160527;
  --bg-2:#2e0d4f;
  --purple:#7b3fa0;
  --purple-light:#b98ce0;
  --text:#f4ecff;
  --muted:#a98fc4;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{height:100%;}

body{
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  background:var(--bg-0);
  color:var(--text);
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============ BACKGROUND LAYERS ============ */
.aurora{
  position:fixed; inset:-25%; z-index:-4;
  background:
    radial-gradient(circle at 22% 18%, rgba(123,63,160,.55), transparent 42%),
    radial-gradient(circle at 78% 76%, rgba(212,175,55,.16), transparent 42%),
    radial-gradient(circle at 62% 22%, rgba(90,26,122,.55), transparent 48%),
    radial-gradient(circle at 30% 85%, rgba(58,13,94,.6), transparent 45%);
  filter:blur(70px);
  animation:auroraDrift 22s ease-in-out infinite alternate;
}
@keyframes auroraDrift{
  0%{transform:translate3d(-2%,-1%,0) scale(1) rotate(0deg);}
  50%{transform:translate3d(1.5%,2%,0) scale(1.06) rotate(2deg);}
  100%{transform:translate3d(2.5%,-1.5%,0) scale(1.1) rotate(-2deg);}
}

.grid-layer{
  position:fixed; inset:0; z-index:-3;
  background-image:
    linear-gradient(rgba(212,175,55,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,175,55,.055) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 48%, #000 0%, rgba(0,0,0,.5) 45%, transparent 78%);
  mask-image:radial-gradient(circle at 50% 48%, #000 0%, rgba(0,0,0,.5) 45%, transparent 78%);
  animation:gridSlide 24s linear infinite;
}
@keyframes gridSlide{ to{ background-position:64px 64px; } }

.vignette{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 30%, rgba(7,2,14,.55) 78%, rgba(7,2,14,.95) 100%);
}

/* floating dust particles */
.dust{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
.dust i{
  position:absolute;bottom:-10px;
  width:3px;height:3px;border-radius:50%;
  background:radial-gradient(circle,#ffe9a8,#d4af37);
  opacity:0;
  box-shadow:0 0 8px rgba(212,175,55,.9);
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  10%{opacity:.85;}
  90%{opacity:.5;}
  100%{transform:translateY(-105vh) translateX(var(--dx,20px));opacity:0;}
}

/* ============ HEADER ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;
  pointer-events:none;
}
header > *{pointer-events:auto;}

.brand{
  display:flex;align-items:center;gap:12px;
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:.42em;
  color:var(--gold-light);
  text-shadow:0 0 22px rgba(212,175,55,.55), 0 0 46px rgba(212,175,55,.25);
  animation:brandGlow 5s ease-in-out infinite;
  padding-left:2px;
}
@keyframes brandGlow{
  0%,100%{text-shadow:0 0 18px rgba(212,175,55,.45),0 0 40px rgba(212,175,55,.2);}
  50%{text-shadow:0 0 28px rgba(255,233,168,.85),0 0 60px rgba(212,175,55,.4);}
}
.brand .seal{
  width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8dd,#d4af37 60%,#8a6a12);
  box-shadow:0 0 12px rgba(255,215,100,.9);
  animation:sealPulse 2.4s ease-in-out infinite;
}
@keyframes sealPulse{
  0%,100%{transform:scale(1);opacity:.9;}
  50%{transform:scale(1.35);opacity:1;}
}

.icon-btn{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(212,175,55,.28);
  color:var(--gold-soft);
  cursor:pointer;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:transform .35s cubic-bezier(.2,.9,.2,1), border-color .35s, box-shadow .35s, background .35s;
}
.icon-btn svg{width:19px;height:19px;}
.icon-btn:hover{
  transform:rotate(90deg) scale(1.08);
  border-color:rgba(212,175,55,.75);
  box-shadow:0 0 26px rgba(212,175,55,.4), inset 0 0 16px rgba(212,175,55,.12);
  background:rgba(212,175,55,.09);
}
.icon-btn:active{transform:rotate(90deg) scale(.94);}

/* ============ MAIN ============ */
main{
  position:relative;z-index:5;
  height:100dvh;
  display:flex;flex-direction:column;
  padding:84px 18px 22px;
}

/* ---- STAGE / ORB ---- */
.stage{
  flex:1 1 auto;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:0;
  gap:6px;
}

.orb{
  --size:270px;
  position:relative;
  width:var(--size);height:var(--size);
  display:grid;place-items:center;
  transition:filter .6s ease;
}
.orb::before{
  content:'';
  position:absolute;inset:-18%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,55,.14) 0%, transparent 62%);
  filter:blur(24px);
  animation:haloBreathe 5s ease-in-out infinite;
}
@keyframes haloBreathe{
  0%,100%{opacity:.55;transform:scale(.94);}
  50%{opacity:1;transform:scale(1.06);}
}

.ring{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.ring::after{content:'';position:absolute;inset:0;border-radius:50%;}

.ring-1{
  inset:0;
  background:conic-gradient(from 0deg, transparent 0deg, transparent 190deg, rgba(212,175,55,.15) 250deg, #d4af37 320deg, #ffe9a8 348deg, transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
  animation:spin 9s linear infinite;
  filter:drop-shadow(0 0 8px rgba(212,175,55,.6));
}
.ring-2{
  inset:11%;
  background:conic-gradient(from 180deg, transparent 0deg, rgba(185,140,224,.1) 200deg, rgba(185,140,224,.8) 320deg, transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
  animation:spin 14s linear infinite reverse;
  filter:drop-shadow(0 0 6px rgba(185,140,224,.5));
}
.ring-3{
  inset:23%;
  border:1px solid rgba(212,175,55,.16);
  animation:spin 26s linear infinite;
}
.ring-3::after{
  inset:-1px;
  border:1px solid transparent;
  border-top-color:rgba(255,233,168,.7);
  border-right-color:rgba(212,175,55,.35);
  filter:drop-shadow(0 0 5px rgba(255,233,168,.7));
}
.ring-4{
  inset:5%;
  border:1px dashed rgba(185,140,224,.16);
  animation:spin 40s linear infinite reverse;
}

@keyframes spin{ to{ transform:rotate(360deg); } }

.orbit-dots{
  position:absolute;inset:0;
  animation:spin 16s linear infinite;
  pointer-events:none;
}
.orbit-dots span{
  position:absolute;
  top:50%;left:50%;
  width:5px;height:5px;
  margin:-2.5px 0 0 -2.5px;
  border-radius:50%;
  background:radial-gradient(circle,#fff8dd,#d4af37 70%);
  box-shadow:0 0 10px rgba(255,215,100,.95), 0 0 20px rgba(212,175,55,.5);
  transform:rotate(calc(var(--i) * 60deg)) translateX(calc(var(--size) * 0.5));
  opacity:.85;
}

.core{
  position:relative;z-index:3;
  width:34%;height:34%;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #fffdf2 0%, #ffe9a8 22%, #ffd970 42%, #d4af37 64%, #8a6a12 100%);
  box-shadow:
    0 0 34px rgba(255,215,100,.75),
    0 0 80px rgba(212,175,55,.42),
    0 0 140px rgba(212,175,55,.22),
    inset 0 0 22px rgba(255,255,255,.55);
  animation:coreBreathe 3.4s ease-in-out infinite;
}
@keyframes coreBreathe{
  0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(255,215,100,.65),0 0 70px rgba(212,175,55,.35),0 0 120px rgba(212,175,55,.18),inset 0 0 20px rgba(255,255,255,.5);}
  50%{transform:scale(1.075);box-shadow:0 0 48px rgba(255,225,130,.95),0 0 110px rgba(212,175,55,.6),0 0 180px rgba(212,175,55,.3),inset 0 0 26px rgba(255,255,255,.7);}
}
.core::after{
  content:'';
  position:absolute;inset:22%;
  border-radius:50%;
  background:radial-gradient(circle at 40% 32%, rgba(255,255,255,.95), transparent 62%);
  filter:blur(3px);
  opacity:.7;
}

/* ORB STATES */
.orb.listening .ring-1{animation-duration:2.6s;}
.orb.listening .ring-2{animation-duration:3.4s;}
.orb.listening .ring-3{animation-duration:8s;}
.orb.listening .orbit-dots{animation-duration:5s;}
.orb.listening .core{animation-duration:1.1s;}

.orb.thinking .ring-1{animation-duration:1.3s;}
.orb.thinking .ring-2{animation-duration:1.9s;}
.orb.thinking .ring-3{animation-duration:5s;}
.orb.thinking .ring-4{animation-duration:9s;}
.orb.thinking .orbit-dots{animation-duration:3s;}
.orb.thinking .core{animation-duration:1.6s;
  background:radial-gradient(circle at 34% 28%, #ffffff 0%, #f0dcff 22%, #c9a3ee 44%, #8b4fc0 66%, #4b1d7a 100%);
  box-shadow:0 0 40px rgba(185,140,224,.9),0 0 100px rgba(140,80,200,.55),0 0 160px rgba(120,60,180,.3),inset 0 0 24px rgba(255,255,255,.6);
}

.orb.speaking .ring-1{animation-duration:3.6s;}
.orb.speaking .ring-2{animation-duration:5.5s;}
.orb.speaking .core{animation-duration:.85s;}

/* ---- STATUS ---- */
.status{
  display:flex;align-items:center;gap:10px;
  margin-top:26px;
  padding:9px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(212,175,55,.2);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  font-size:11.5px;
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  transition:border-color .4s, color .4s, box-shadow .4s;
  white-space:nowrap;
  max-width:92vw;
  overflow:hidden;
  text-overflow:ellipsis;
}
.status .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px rgba(212,175,55,.9);
  flex:none;
  transition:background .3s, box-shadow .3s;
}
.dot.listening{background:#5eead4;box-shadow:0 0 12px #5eead4;animation:blink 1s ease-in-out infinite;}
.dot.thinking{background:#c084fc;box-shadow:0 0 14px #c084fc;animation:blink .65s ease-in-out infinite;}
.dot.speaking{background:#ffd700;box-shadow:0 0 14px #ffd700;animation:blink 1.15s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}}

/* ---- INTERIM ---- */
.interim{
  margin-top:12px;
  min-height:20px;
  font-size:13.5px;
  font-style:italic;
  color:rgba(185,140,224,.85);
  letter-spacing:.02em;
  text-align:center;
  max-width:min(600px,92vw);
  transition:opacity .3s;
}

/* ============ LOG ============ */
.log{
  flex:0 1 auto;
  max-height:29vh;
  overflow-y:auto;
  width:min(700px,100%);
  margin:14px auto 16px;
  padding:2px 4px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:rgba(212,175,55,.4) transparent;
}
.log::-webkit-scrollbar{width:5px;}
.log::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:99px;}
.log::-webkit-scrollbar-track{background:transparent;}

.msg{
  max-width:86%;
  padding:10px 16px;
  border-radius:16px;
  font-size:14px;
  line-height:1.55;
  letter-spacing:.01em;
  animation:msgIn .5s cubic-bezier(.16,.9,.24,1) both;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  word-wrap:break-word;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(14px) scale(.965);filter:blur(4px);}
  to{opacity:1;transform:none;filter:blur(0);}
}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg, rgba(123,63,160,.5), rgba(60,20,95,.55));
  border:1px solid rgba(185,140,224,.32);
  color:#f0e2ff;
  border-bottom-right-radius:5px;
  box-shadow:0 6px 22px rgba(90,26,122,.25);
}
.msg.bot{
  align-self:flex-start;
  background:linear-gradient(135deg, rgba(212,175,55,.13), rgba(212,175,55,.04));
  border:1px solid rgba(212,175,55,.3);
  color:#ffeec2;
  border-bottom-left-radius:5px;
  box-shadow:0 6px 22px rgba(212,175,55,.08);
}
.msg.sys{
  align-self:center;
  background:transparent;
  border:1px dashed rgba(185,140,224,.25);
  color:rgba(169,143,196,.9);
  font-size:12.5px;
  text-align:center;
  border-radius:12px;
}
.msg a{color:var(--gold-light);text-decoration:underline;text-underline-offset:3px;}

/* ============ CONTROLS ============ */
.controls{
  flex:none;
  display:flex;flex-direction:column;align-items:center;
  gap:16px;
  width:100%;
}

.mic-btn{
  position:relative;
  width:76px;height:76px;border-radius:50%;
  border:1px solid rgba(212,175,55,.45);
  background:radial-gradient(circle at 34% 28%, rgba(255,233,168,.2), rgba(24,7,44,.92));
  color:var(--gold-light);
  cursor:pointer;
  display:grid;place-items:center;
  transition:transform .35s cubic-bezier(.2,.9,.2,1), box-shadow .35s, border-color .35s, background .35s;
  box-shadow:0 0 30px rgba(212,175,55,.2), inset 0 0 22px rgba(212,175,55,.08);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  flex:none;
}
.mic-btn svg{width:28px;height:28px;transition:transform .3s;}
.mic-btn:hover{
  transform:scale(1.07);
  border-color:rgba(212,175,55,.85);
  box-shadow:0 0 50px rgba(212,175,55,.45), inset 0 0 28px rgba(212,175,55,.18);
}
.mic-btn:active{transform:scale(.93);}
.mic-btn.active{
  background:radial-gradient(circle at 34% 28%, #fffdf2, #ffd970 45%, #d4af37 100%);
  color:#1b0730;
  border-color:rgba(255,233,168,.9);
  box-shadow:0 0 60px rgba(255,215,100,.8), 0 0 120px rgba(212,175,55,.45);
}
.mic-btn.active svg{transform:scale(1.08);}
.mic-btn::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(212,175,55,.55);
  opacity:0;pointer-events:none;
}
.mic-btn.active::before{animation:ripple 1.7s ease-out infinite;}
.mic-btn.active::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(255,233,168,.45);
  opacity:0;pointer-events:none;
  animation:ripple 1.7s ease-out .6s infinite;
}
@keyframes ripple{
  0%{transform:scale(1);opacity:.85;}
  100%{transform:scale(1.85);opacity:0;}
}

.input-bar{
  display:flex;align-items:center;gap:8px;
  width:min(520px,100%);
  padding:6px 6px 6px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.033);
  border:1px solid rgba(212,175,55,.2);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:border-color .35s, box-shadow .35s, background .35s;
}
.input-bar:focus-within{
  border-color:rgba(212,175,55,.6);
  box-shadow:0 0 0 3px rgba(212,175,55,.07), 0 0 34px rgba(212,175,55,.14);
  background:rgba(255,255,255,.05);
}
.input-bar input{
  flex:1;min-width:0;
  background:none;border:none;outline:none;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  font-weight:300;
  letter-spacing:.015em;
  padding:11px 0;
}
.input-bar input::placeholder{color:rgba(169,143,196,.62);font-weight:300;}

.send-btn{
  width:40px;height:40px;border-radius:50%;
  border:none;cursor:pointer;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#fff3c4 0%,#ffd970 35%,#d4af37 70%,#a67c00 100%);
  color:#1b0730;
  flex:none;
  transition:transform .28s cubic-bezier(.2,.9,.2,1), box-shadow .28s;
  box-shadow:0 0 18px rgba(212,175,55,.4);
}
.send-btn svg{width:17px;height:17px;}
.send-btn:hover{transform:scale(1.1) rotate(-8deg);box-shadow:0 0 30px rgba(212,175,55,.7);}
.send-btn:active{transform:scale(.9);}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:200;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(6,1,12,.72);
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.modal.open{opacity:1;pointer-events:auto;}

.modal-card{
  position:relative;
  width:min(470px,100%);
  max-height:88dvh;
  overflow-y:auto;
  padding:30px 28px 26px;
  border-radius:24px;
  background:linear-gradient(160deg, rgba(52,16,88,.96) 0%, rgba(24,7,44,.97) 55%, rgba(14,3,26,.98) 100%);
  border:1px solid rgba(212,175,55,.32);
  box-shadow:
    0 40px 100px rgba(0,0,0,.7),
    0 0 70px rgba(212,175,55,.1),
    inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(26px) scale(.955);
  opacity:0;
  transition:transform .45s cubic-bezier(.16,.9,.24,1), opacity .4s ease;
  scrollbar-width:thin;
  scrollbar-color:rgba(212,175,55,.35) transparent;
}
.modal.open .modal-card{transform:none;opacity:1;}
.modal-card::-webkit-scrollbar{width:5px;}
.modal-card::-webkit-scrollbar-thumb{background:rgba(212,175,55,.32);border-radius:99px;}

.modal-card::before{
  content:'';
  position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,233,168,.85),transparent);
  filter:drop-shadow(0 0 6px rgba(255,233,168,.8));
}

.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;
}
.modal-title{
  font-family:'Cinzel',serif;
  font-size:13px;
  letter-spacing:.28em;
  color:var(--gold-light);
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(212,175,55,.45);
}
.close-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(212,175,55,.22);
  color:var(--muted);
  cursor:pointer;
  transition:.3s;
}
.close-btn svg{width:15px;height:15px;}
.close-btn:hover{color:var(--gold-light);border-color:rgba(212,175,55,.7);transform:rotate(90deg);background:rgba(212,175,55,.1);}

.field{margin-bottom:20px;}
.field label{
  display:block;
  font-size:10.5px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(185,140,224,.9);
  margin-bottom:9px;
  font-weight:500;
}
.field-note{
  font-size:11.5px;
  color:rgba(169,143,196,.75);
  margin-top:7px;
  line-height:1.5;
  font-weight:300;
}
.field-note a{color:var(--gold-soft);text-decoration:none;border-bottom:1px dotted rgba(212,175,55,.5);}

.input-wrap{
  position:relative;
  display:flex;align-items:center;
}
.input-wrap input,
.select-wrap select{
  width:100%;
  padding:13px 46px 13px 16px;
  border-radius:12px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(185,140,224,.22);
  color:var(--text);
  font-family:inherit;
  font-size:13.5px;
  font-weight:300;
  letter-spacing:.02em;
  outline:none;
  transition:border-color .3s, box-shadow .3s, background .3s;
}
.select-wrap select{
  padding-right:16px;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;

<script>
(function () {
  'use strict';

  /* ============================================================
     DOM
  ============================================================ */
  const $ = (id) => document.getElementById(id);

  const orb         = $('orb');
  const statusDot   = $('statusDot');
  const statusText  = $('statusText');
  const interimEl   = $('interim');
  const logEl       = $('log');
  const micBtn      = $('micBtn');
  const textInput   = $('textInput');
  const sendBtn     = $('sendBtn');
  const toastEl     = $('toast');

  const settingsBtn   = $('settingsBtn');
  const settingsModal = $('settingsModal');
  const closeSettings = $('closeSettings');
  const apiKeyInput   = $('apiKeyInput');
  const eyeBtn        = $('eyeBtn');
  const eyeIcon       = $('eyeIcon');
  const keyStatus     = $('keyStatus');
  const keyStatusText = $('keyStatusText');
  const voiceSelect   = $('voiceSelect');
  const langSelect    = $('langSelect');
  const saveBtn       = $('saveBtn');
  const testBtn       = $('testBtn');
  const clearBtn      = $('clearBtn');

  /* ============================================================
     STATE
  ============================================================ */
  const LS_KEY   = 'jarvis_gemini_key';
  const LS_VOICE = 'jarvis_voice_name';
  const LS_LANG  = 'jarvis_lang';

  const state = {
    apiKey: localStorage.getItem(LS_KEY) || '',
    voiceName: localStorage.getItem(LS_VOICE) || '',
    lang: localStorage.getItem(LS_LANG) || 'en-IN',
    listening: false,
    processing: false,
    history: []
  };

  let voices = [];
  let recognition = null;
  let gotResult = false;

  /* ============================================================
     SITE DIRECTORY
  ============================================================ */
  const SITES = [
    ['google drive', 'https://drive.google.com'],
    ['google maps',  'https://maps.google.com'],
    ['youtube music','https://music.youtube.com'],
    ['youtube',      'https://www.youtube.com'],
    ['google',       'https://www.google.com'],
    ['gmail',        'https://mail.google.com'],
    ['whatsapp',     'https://web.whatsapp.com'],
    ['instagram',    'https://www.instagram.com'],
    ['facebook',     'https://www.facebook.com'],
    ['twitter',      'https://x.com'],
    ['chatgpt',      'https://chat.openai.com'],
    ['github',       'https://github.com'],
    ['maps',         'https://maps.google.com'],
    ['spotify',      'https://open.spotify.com'],
    ['netflix',      'https://www.netflix.com'],
    ['amazon',       'https://www.amazon.in'],
    ['flipkart',     'https://www.flipkart.com'],
    ['linkedin',     'https://www.linkedin.com'],
    ['telegram',     'https://web.telegram.org'],
    ['reddit',       'https://www.reddit.com'],
    ['wikipedia',    'https://www.wikipedia.org'],
    ['gemini',       'https://gemini.google.com'],
    ['drive',        'https://drive.google.com'],
    ['stackoverflow','https://stackoverflow.com'],
    ['hotstar',      'https://www.hotstar.com'],
    ['prime video',  'https://www.primevideo.com']
  ];

  /* ============================================================
     BACKGROUND DUST
  ============================================================ */
  (function createDust() {
    const dust = $('dust');
    const n = window.innerWidth < 600 ? 18 : 32;
    let html = '';
    for (let i = 0; i < n; i++) {
      const left = Math.random() * 100;
      const dur  = 16 + Math.random() * 22;
      const del  = Math.random() * 30;
      const dx   = (Math.random() * 80 - 40).toFixed(0);
      const size = (Math.random() * 2 + 1.4).toFixed(1);
      const op   = (0.35 + Math.random() * 0.5).toFixed(2);
      html += `<i style="left:${left}%;width:${size}px;height:${size}px;--dx:${dx}px;animation-duration:${dur}s;animation-delay:-${del}s;opacity:${op};"></i>`;
    }
    dust.innerHTML = html;
  })();

  /* ============================================================
     UI HELPERS
  ============================================================ */
  function setMode(mode, text) {
    orb.classList.remove('listening', 'thinking', 'speaking');
    if (mode && mode !== 'idle') orb.classList.add(mode);
    statusDot.className = 'dot' + (mode && mode !== 'idle' ? ' ' + mode : '');
    if (text) statusText.textContent = text;
  }

  function setInterim(text) {
    interimEl.textContent = text || '';
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function addMessage(role, text, isHTML) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    if (isHTML) el.innerHTML = text;
    else el.textContent = text;
    logEl.appendChild(el);
    requestAnimationFrame(() => {
      logEl.scrollTop = logEl.scrollHeight;
    });
    return el;
  }

  /* ============================================================
     VOICE ENGINE
  ============================================================ */
  const FEMALE_HINT = /(female|woman|zira|samantha|victoria|karen|moira|tessa|fiona|susan|hazel|swara|kalpana|heera|veena|lekha|aria|jenny|michelle|sonia|natasha|clara|ava|emma|sara|priya|ananya|google uk english female|google us english)/i;
  const MALE_HINT   = /(male|david|mark|george|daniel|james|alex|fred|raj|rishi|hemant|guy|ryan|thomas|oliver|arthur)/i;

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const v = speechSynthesis.getVoices();
    if (!v || !v.length) return;
    voices = v;
    populateVoiceSelect();
  }

  function populateVoiceSelect() {
    if (!voiceSelect) return;
    const prev = state.voiceName;
    voiceSelect.innerHTML = '';

    const autoOpt = document.createElement('option');
    autoOpt.value = '';
    autoOpt.textContent = 'Auto (Recommended Female)';
    voiceSelect.appendChild(autoOpt);

    // sort: female-ish first, then language match
    const sorted = voices.slice().sort((a, b) => {
      const aF = FEMALE_HINT.test(a.name) && !MALE_HINT.test(a.name) ? 0 : 1;
      const bF = FEMALE_HINT.test(b.name) && !MALE_HINT.test(b.name) ? 0 : 1;
      if (aF !== bF) return aF - bF;
      const aL = a.lang.toLowerCase().startsWith(state.lang.slice(0, 2)) ? 0 : 1;
      const bL = b.lang.toLowerCase().startsWith(state.lang.slice(0, 2)) ? 0 : 1;
      return aL - bL;
    });

    sorted.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name + ' — ' + v.lang;
      voiceSelect.appendChild(opt);
    });

    if (prev && voices.some(v => v.name === prev)) {
      voiceSelect.value = prev;
    } else {
      voiceSelect.value = '';
    }
  }

  function pickVoice() {
    if (!voices.length) return null;

    if (state.voiceName) {
      const chosen = voices.find(v => v.name === state.voiceName);
      if (chosen) return chosen;
    }

    const langPrefix = (state.lang || 'en').slice(0, 2).toLowerCase();
    const sameLang = voices.filter(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(langPrefix));
    const pool = sameLang.length ? sameLang : voices;

    const female = pool.find(v => FEMALE_HINT.test(v.name) && !MALE_HINT.test(v.name));
    if (female) return female;

    const enFemale = voices.find(v => /^en/i.test(v.lang) && FEMALE_HINT.test(v.name) && !MALE_HINT.test(v.name));
    if (enFemale) return enFemale;

    return pool[0] || voices[0];
  }

  function cleanForSpeech(s) {
    return String(s)
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^\s{0,3}#{1,6}\s*/gm, '')
      .replace(/^\s*[-*+•]\s+/gm, '')
      .replace(/^\s*\d+[.)]\s+/gm, '')
      .replace(/[*_#>|]/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function speak(text, onDone) {
    if (!('speechSynthesis' in window)) {
      if (onDone) onDone();
      return;
    }
    const clean = cleanForSpeech(text);
    if (!clean) { if (onDone) onDone(); return; }

    try { speechSynthesis.cancel(); } catch (e) {}

    const u = new SpeechSynthesisUtterance(clean.slice(0, 900));
    const v = pickVoice();
    if (v) {
      u.voice = v;
      u.lang = v.lang;
    } else {
      u.lang = state.lang;
    }
    u.pitch = 1.18;   // feminine
    u.rate  = 1.0;
    u.volume = 1;

    u.onstart = () => setMode('speaking', 'Speaking');
    u.onend = () => {
      setMode('idle', 'Tap the mic to speak');
      if (onDone) onDone();
    };
    u.onerror = () => {
      setMode('idle', 'Tap the mic to speak');
      if (onDone) onDone();
    };

    speechSynthesis.speak(u);
  }

  /* ============================================================
     SPEECH RECOGNITION
  ============================================================ */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SR) {
    recognition = new SR();
    recognition.lang = state.lang;
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      state.listening = true;
      gotResult = false;
      micBtn.classList.add('active');
      setMode('listening', 'Listening');
      setInterim('');
    };

    recognition.onresult = (e) => {
      let interim = '';
      let finalText = '';

      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }

      if (interim) setInterim(interim);

      if (finalText.trim()) {
        gotResult = true;
        setInterim('');
        try { recognition.stop(); } catch (err) {}
        handleUserInput(finalText.trim());
      }
    };

    recognition.onerror = (e) => {
      state.listening = false;
      micBtn.classList.remove('active');
      if (e.error === 'no-speech') {
        setMode('idle', 'Nothing heard — try again');
      } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setMode('idle', 'Microphone blocked');
        toast('Microphone permission denied');
      } else if (e.error === 'aborted') {
        setMode('idle', 'Tap the mic to speak');
      } else {
        setMode('idle', 'Tap the mic to speak');
      }
      setInterim('');
    };

    recognition.onend = () => {
      state.listening = false;
      micBtn.classList.remove('active');
      if (!gotResult && !state.processing) {
        setMode('idle', 'Tap the mic to speak');
      }
      gotResult = false;
    };
  }

  function toggleMic() {
    if (!recognition) {
      addMessage('bot', 'Speech recognition is not supported in this browser. Please use Chrome or Edge, or type your command below.');
      toast('Use Chrome or Edge for voice');
      return;
    }
    if (state.listening) {
      try { recognition.stop(); } catch (e) {}
      return;
    }
    if (speechSynthesis.speaking) {
      try { speechSynthesis.cancel(); } catch (e) {}
    }
    try {
      recognition.lang = state.lang;
      recognition.start();
    } catch (err) {
      try { recognition.stop(); } catch (e) {}
      setTimeout(() => {
        try { recognition.start(); } catch (e) {}
      }, 280);
    }
  }

  /* ============================================================
     OPEN URL (with popup-block fallback)
  ============================================================ */
  function openURL(url, label) {
    let win = null;
    try { win = window.open(url, '_blank', 'noopener'); } catch (e) { win = null; }
    if (!win) {
      addMessage(
        'bot',
        'Popup was blocked. <a href="' + url + '" target="_blank" rel="noopener">Open ' +
        (label || 'link') + '</a>'
      );
    }
  }

  /* ============================================================
     COMMAND PARSER
  ============================================================ */
  function extractQuery(raw, removeWords) {
    let q = ' ' + raw.toLowerCase() + ' ';
    const words = removeWords.split('|').join('|');
    q = q.replace(new RegExp('\\b(' + words + ')\\b', 'gi'), ' ');
    q = q.replace(/[^\w\s\u0900-\u097F]/g, ' ');
    q = q.replace(/\s{2,}/g, ' ').trim();
    return q;
  }

  function parseCommand(raw) {
    const t = ' ' + raw.toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

    /* ---- TIME ---- */
    if (/\b(what( is|'s)? the time|what time is it|current time|time kya|kitna baje|samay kya|time batao)\b/.test(t)) {
      const now = new Date();
      const s = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      return { reply: 'It is ' + s + ' right now.' };
    }

    /* ---- DATE ---- */
    if (/\b(what( is|'s)? the date|what is today|today'?s date|aaj ki tarikh|date kya|aaj kaun si tarikh)\b/.test(t)) {
      const d = new Date().toLocaleDateString('en-IN', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      return { reply: 'Today is ' + d + '.' };
    }

    /* ---- DAY ---- */
    if (/\b(what day is it|which day is today|aaj kaun sa din)\b/.test(t)) {
      const d = new Date().toLocaleDateString('en-IN', { weekday: 'long' });
      return { reply: 'Today is ' + d + '.' };
    }

    /* ---- GREETING ---- */
    if (/^( hello| hi| hey| namaste| namaskar| good morning| good evening| good afternoon| kaise ho| how are you)\b/.test(t) &&
        t.trim().split(' ').length <= 5) {
      const hr = new Date().getHours();
      let greet = 'Hello';
      if (hr < 12) greet = 'Good morning';
      else if (hr < 17) greet = 'Good afternoon';
      else if (hr < 21) greet = 'Good evening';
      return { reply: greet + '. I am JARVIS. How may I assist you?' };
    }

    /* ---- YOUTUBE PLAY / SEARCH ---- */
    if (/\byoutube\b/.test(t) && /\b(play|search|find|bajao|baja|dhundo|chalao|sunao|dekhna)\b/.test(t)) {
      const q = extractQuery(raw, 'play|search|find|bajao|baja|dhundo|chalao|sunao|dekhna|on|youtube|par|pe|mein|me|please|karo|kar|do|de|for|the|a|an|jarvis|hey|song|video');
      if (q) {
        const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
        return {
          reply: 'Playing ' + q + ' on YouTube.',
          action: () => openURL(url, 'YouTube search')
        };
      }
      return { reply: 'Opening YouTube.', action: () => openURL('https://www.youtube.com', 'YouTube') };
    }

    /* ---- PLAY SONG (default youtube) ---- */
    let m = t.match(/\b(?:play|bajao|baja do|sunao)\s+(.+?)\s*$/);
    if (m && m[1] && m[1].trim().length > 1 && !/\b(open|kholo)\b/.test(t)) {
      const q = extractQuery(m[1], 'please|karo|kar|do|de|jarvis|hey|for|me|the|a|an|song|music');
      if (q) {
        const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
        return {
          reply: 'Playing ' + q + ' on YouTube.',
          action: () => openURL(url, 'YouTube search')
        };
      }
    }

    /* ---- GOOGLE SEARCH ---- */
    if (/\bgoogle\b/.test(t) && /\b(search|dhundo|khojo|find)\b/.test(t)) {
      const q = extractQuery(raw, 'search|dhundo|khojo|find|google|on|par|pe|please|karo|kar|do|de|for|the|a|an|jarvis|hey');
      if (q) {
        const url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        return {
          reply: 'Searching Google for ' + q + '.',
          action: () => openURL(url, 'Google search')
        };
      }
    }

    /* ---- OPEN WEBSITE ---- */
    if (/\b(open|launch|start|kholo|khol|khol do|chalu)\b/.test(t)) {
      for (const [name, url] of SITES) {
        if (t.includes(' ' + name + ' ') || t.includes(' ' + name) || t.includes(name + ' ')) {
          return {
            reply: 'Opening ' + name + '.',
            action: () => openURL(url, name)
          };
        }
      }
    }

    /* ---- GENERIC SEARCH ---- */
    m = t.match(/^\s*(search|google|find|dhundo|khojo)\s+(.+?)\s*$/);
    if (m && m[2] && m[2].trim().length > 1) {
      const q = extractQuery(m[2], 'please|karo|kar|do|de|for|me|the|a|an|on|google|jarvis|hey');
      if (q) {
        const url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        return {
          reply: 'Searching for ' + q + '.',
          action: () => openURL(url, 'Google search')
        };
      }
    }

    /* ---- STOP / CANCEL ---- */
    if (/^( stop| cancel| chup| band karo| ruko| quiet| shut up)\b/.test(t) && t.trim().split(' ').length <= 4) {
      try { speechSynthesis.cancel(); } catch (e) {}
      return { reply: 'Okay. Standing by.' };
    }

    return null;
  }

  /* ============================================================
     GEMINI API
  ============================================================ */
  const SYSTEM_PROMPT =
    'You are JARVIS, an elegant, highly intelligent female voice assistant with a calm, refined, slightly warm personality. ' +
    'You are speaking out loud through a speaker, so your replies must sound natural when read aloud. ' +
    'Rules: ' +
    '1) Reply in the SAME language the user used (Hindi, Hinglish, or English). If the user mixes Hindi and English, reply in natural Hinglish. ' +
    '2) Keep answers concise: 2 to 4 sentences unless the user explicitly asks for detail, a list, or a step-by-step explanation. ' +
    '3) Never use markdown, asterisks, bullet points, headers, emojis, or code blocks. Plain conversational sentences only. ' +
    '4) Do not mention that you are an AI language model. You are JARVIS. ' +
    '5) If you are uncertain, say so briefly and give your best answer. ' +
    '6) For factual or research questions, give accurate, well-organized information.';

  const MODELS = ['gemini-2.0-flash', 'gemini-2.5-flash', 'gemini-1.5-flash'];

  async function askGemini(prompt) {
    const contents = state.history
      .slice(-8)
      .concat([{ role: 'user', parts: [{ text: prompt }] }]);

    let lastError = null;

    for (const model of MODELS) {
      try {
        const res = await fetch(
          'https://generativelanguage.googleapis.com/v1beta/models/' +
            model + ':generateContent?key=' + encodeURIComponent(state.apiKey),
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: contents,
              generationConfig: {
                temperature: 0.85,
                topP: 0.95,
                maxOutputTokens: 800
              },
              safetySettings: [
                { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
                { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
                { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
                { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' }
              ]
            })
          }
        );

        if (!res.ok) {
          let msg = 'HTTP ' + res.status;
          try {
            const errJson = await res.json();
            if (errJson && errJson.error && errJson.error.message) msg = errJson.error.message;
          } catch (e) {}
          lastError = new Error(msg);
          // If model not found, try the next one. Otherwise stop.
          if (res.status === 404) continue;
          throw lastError;
        }

        const data = await res.json();
        const cand = data && data.candidates && data.candidates[0];
        let text = '';
        if (cand && cand.content && cand.content.parts) {
          text = cand.content.parts.map(p => p.text || '').join('').trim();
        }

        if (!text) {
          if (cand && cand.finishReason === 'SAFETY') {
            text = 'I am unable to answer that request. Please try asking something else.';
          } else {
            text = 'I could not generate a response for that. Please try rephrasing.';
          }
        }

        state.history.push({ role: 'user', parts: [{ text: prompt }] });
        state.history.push({ role: 'model', parts: [{ text: text }] });
        if (state.history.length > 20) state.history = state.history.slice(-20);

        return text;

      } catch (err) {
        lastError = err;
        if (err && /404/.test(err.message)) continue;
        break;
      }
    }

    throw lastError || new Error('Unknown error');
  }

  /* ============================================================
     MAIN INPUT HANDLER
  ============================================================ */
  async function handleUserInput(text) {
    const clean = String(text || '').trim();
    if (!clean || state.processing) return;

    addMessage('user', clean);
    textInput.value = '';
    setInterim('');

    const cmd = parseCommand(clean);
    if (cmd) {
      state.processing = true;
      addMessage('bot', cmd.reply);
      setMode('speaking', 'Executing');
      if (cmd.action) {
        setTimeout(() => {
          try { cmd.action(); } catch (e) {}
        }, 450);
      }
      speak(cmd.reply, () => { state.processing = false; });
      setTimeout(() => { state.processing = false; }, 6000);
      return;
    }

    if (!state.apiKey) {
      const msg = 'Please add your Gemini API key in settings first, then I can research anything for you.';
      addMessage('bot', msg);
      speak(msg);
      setTimeout(openSettings, 900);
      return;
    }

    state.processing = true;
    setMode('thinking', 'Thinking');
    setInterim('');

    const thinkingEl = addMessage('bot', 'Researching…');

    try {
      const answer = await askGemini(clean);
      thinkingEl.remove();
      addMessage('bot', answer);
      setMode('speaking', 'Speaking');
      speak(answer, () => {
        state.processing = false;
        setMode('idle', 'Tap the mic to speak');
      });
    } catch (err) {
      thinkingEl.remove();
      let msg = 'I could not reach the server. ';
      const m = (err && err.message) || '';
      if (/API key not valid|API_KEY_INVALID|invalid/i.test(m)) {
        msg = 'Your API key appears to be invalid. Please check it in settings.';
      } else if (/quota|RESOURCE_EXHAUSTED|429/i.test(m)) {
        msg = 'The API quota has been reached. Please try again in a moment.';
      } else if (/Failed to fetch|NetworkError/i.test(m)) {
        msg = 'Network error. Please check your internet connection.';
      } else if (m) {
        msg = 'Something went wrong: ' + m;
      }
      addMessage('bot', msg);
      speak('Sorry, something went wrong. Please check your API key and connection.');
      setMode('idle', 'Tap the mic to speak');
      state.processing = false;
    }
  }

  /* ============================================================
     SETTINGS
  ============================================================ */
  function openSettings() {
    apiKeyInput.value = state.apiKey;
    apiKeyInput.type = 'password';
    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    langSelect.value = state.lang;
    if (voices.length) populateVoiceSelect();
    updateKeyStatus();
    settingsModal.classList.add('open');
  }

  function closeSettingsFn() {
    settingsModal.classList.remove('open');
  }

  function updateKeyStatus() {
    if (state.apiKey) {
      keyStatus.classList.add('ok');
      keyStatusText.textContent = 'Key saved · ' + state.apiKey.slice(0, 6) + '••••' + state.apiKey.slice(-4);
    } else {
      keyStatus.classList.remove('ok');
      keyStatusText.textContent = 'No key saved';
    }
  }

  /* ============================================================
     EVENTS
  ============================================================ */
  micBtn.addEventListener('click', toggleMic);
  sendBtn.addEventListener('click', () => handleUserInput(textInput.value));

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleUserInput(textInput.value);
    }
  });

  settingsBtn.addEventListener('click', openSettings);
  closeSettings.addEventListener('click', closeSettingsFn);

  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) closeSettingsFn();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSettingsFn();
  });

  eyeBtn.addEventListener('click', () => {
    const isPwd = apiKeyInput.type === 'password';
    apiKeyInput.type = isPwd ? 'text' : 'password';
    eyeIcon.innerHTML = isPwd
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  saveBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    state.apiKey = key;
    if (key) localStorage.setItem(LS_KEY, key);
    else localStorage.removeItem(LS_KEY);

    state.lang = langSelect.value;
    localStorage.setItem(LS_LANG, state.lang);
    if (recognition) recognition.lang = state.lang;

    state.voiceName = voiceSelect.value;
    if (state.voiceName) localStorage.setItem(LS_VOICE, state.voiceName);
    else localStorage.removeItem(LS_VOICE);

    updateKeyStatus();
    toast('Settings saved');
    setTimeout(closeSettingsFn, 500);
  });

  testBtn.addEventListener('click', () => {
    const savedLang = state.lang;
    const savedVoice = state.voiceName;
    state.lang = langSelect.value;
    state.voiceName = voiceSelect.value;
    speak('Hello, I am JARVIS. Your personal assistant is ready to serve you.', () => {
      state.lang = savedLang;
      state.voiceName = savedVoice;
    });
  });

  clearBtn.addEventListener('click', () => {
    state.history = [];
    logEl.innerHTML = '';
    addMessage('sys', 'Conversation cleared');
    toast('Conversation cleared');
  });

  window.addEventListener('beforeunload', () => {
    try { speechSynthesis.cancel(); } catch (e) {}
  });

  /* ============================================================
     BOOT
  ============================================================ */
  function boot() {
    if ('speechSynthesis' in window) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
      // Some browsers need a nudge
      setTimeout(loadVoices, 300);
      setTimeout(loadVoices, 1200);
    }

    langSelect.value = state.lang;
    updateKeyStatus();

    addMessage('sys', 'JARVIS online · Voice interface ready');

    if (!state.apiKey) {
      addMessage('bot', 'Welcome. Please open settings (top right) and add your Gemini API key to unlock research and smart replies.');
    } else {
      addMessage('bot', 'Welcome back. I am ready. Tap the microphone or type a command.');
    }
  }

  boot();

})();
</script>
